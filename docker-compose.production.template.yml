services:
  evolution-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: evolution-api:local
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DataProtection__KeyPath: /var/lib/evolution-api/data-protection-keys
      Media__MaxDownloadBytes: "33554432"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - evolution-data-protection:/var/lib/evolution-api/data-protection-keys
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  evolution-data-protection:
